---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base utilities
  ansible.builtin.apt:
    name: [curl, git, jq, unzip, ca-certificates, gnupg, ufw]
    state: present

- name: Allow SSH, HTTP and app port through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["22", "80", "{{ app_port }}"]

- name: Enable UFW (default deny incoming)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
